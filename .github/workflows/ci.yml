name: CI

on:
  pull_request:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs full history to scan all commits in the PR.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # Vitest smoke suite. Build-time env vars are baked at build, so the
        # tests just need values that satisfy Amplify.configure() without
        # actually talking to AWS.
        env:
          VITE_AWS_REGION: us-west-2
          VITE_S3_PROD_NAME: ci-placeholder
          VITE_AWS_USER_POOL_ID: us-west-2_test
          VITE_AWS_WEB_CLIENT_ID: ci-placeholder
          VITE_AWS_IDENTITY_POOL_ID: "us-west-2:00000000-0000-0000-0000-000000000000"
          VITE_COGNITO_DOMAIN: ci-placeholder.example.com
          VITE_API_URL: https://ci-placeholder.example.com
        run: npm test

      - name: Build
        run: npm run build

      - name: npm audit (high+)
        # Informational until the Amplify dep tree ships fewer vulns. The
        # PR should eventually fail on NEW vulns we introduce, but the
        # existing baseline isn't something we can clear from the app side.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Install gitleaks
        # Use the OSS binary directly. The gitleaks-action wrapper now
        # requires a paid license for org repos, but the underlying tool
        # is still MIT-licensed and free.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      - name: Gitleaks secret scan
        run: gitleaks detect --source . --redact --verbose --exit-code 1
