name: CI

on:
  pull_request:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs full history to scan all commits in the PR.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (CRA)
        env:
          # Matches deploy.yml: CRA treats warnings as errors when CI=true,
          # and the codebase has accumulated lint warnings we don't want to
          # gate PRs on. Tighten this when we migrate to Vite.
          CI: ""
        run: npm run build

      - name: npm audit (high+)
        # Informational until CRA -> Vite migration clears the bulk of CRA-tree
        # vulns. The PR should fail on NEW vulns we introduce, but the existing
        # baseline isn't something we can clear without the framework swap.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
