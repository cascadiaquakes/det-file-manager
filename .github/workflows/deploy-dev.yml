name: Deploy DET File Manager (Dev)

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      # Prod deploys to s3://<bucket>/det-uploader-app/, dev gets a /dev/
      # subpath under the same prefix so the same CloudFront distribution
      # serves both at det-uploader.cascadiaquakes.org/ and /dev/.
      S3_PREFIX: ${{ vars.S3_PREFIX }}/dev
      CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::818214664804:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-det-file-manager-dev

      - name: Create .env for Vite build
        # Dev shares the prod Cognito / API / S3 backend on purpose — this
        # environment exists to preview UI changes, not to be a fully isolated
        # test stack. If we ever stand up a separate dev backend, swap these
        # for VITE_DEV_* overrides.
        run: |
          cat > .env <<'EOF'
          VITE_AWS_REGION=${{ vars.VITE_AWS_REGION }}
          VITE_S3_PROD_NAME=${{ vars.VITE_S3_PROD_NAME }}
          VITE_AWS_USER_POOL_ID=${{ vars.VITE_AWS_USER_POOL_ID }}
          VITE_AWS_WEB_CLIENT_ID=${{ vars.VITE_AWS_WEB_CLIENT_ID }}
          VITE_AWS_IDENTITY_POOL_ID=${{ vars.VITE_AWS_IDENTITY_POOL_ID }}
          VITE_COGNITO_DOMAIN=${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_API_URL=${{ vars.VITE_API_URL }}
          EOF

      - name: Show target
        run: |
          echo "Region:        $AWS_REGION"
          echo "S3 target:     s3://$S3_BUCKET/$S3_PREFIX/"
          echo "CloudFront ID: $CF_DISTRIBUTION_ID"

      - name: Install + build
        run: |
          npm ci
          npm run build

      - name: Sync to S3 (dev prefix)
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET/$S3_PREFIX/" \
            --region "$AWS_REGION" \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

          aws s3 cp dist/index.html "s3://$S3_BUCKET/$S3_PREFIX/index.html" \
            --region "$AWS_REGION" \
            --content-type "text/html" \
            --cache-control "no-cache,must-revalidate,public,max-age=0" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache (dev path only)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --paths "/dev/*"

      - name: Smoke test
        run: |
          sleep 15
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://det-uploader.cascadiaquakes.org/dev/index.html)
          echo "Dev HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::warning::Dev smoke test returned HTTP $HTTP_CODE (may be the initial deploy — check the URL manually)"
          fi
